name: Import Upstream CI Branches

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

jobs:
  import-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fork
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.SYNC_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add Upstream Remote
        run: |
          git remote add upstream https://github.com/Yunohost-Apps/peertube_ynh.git
          git fetch upstream --prune
          git fetch origin --prune

      - name: Import New Upstream Branches to Fork
        run: |
          echo "=== IMPORTING NEW BRANCHES ==="
          for remote_branch in $(git branch -r | grep 'upstream/ci-auto-update-'); do
            local_branch=${remote_branch#upstream/}
            
            if ! git show-ref --verify --quiet refs/remotes/origin/$local_branch; then
              echo "New upstream CI branch detected. Importing $local_branch to fork..."
              # Fix: Push the upstream remote tracking branch directly to origin without local checkouts
              git push origin $remote_branch:refs/heads/$local_branch
            fi
          done

      - name: Prune Deleted Branches From Fork
        run: |
          echo "=== PRUNING DELETED BRANCHES ==="
          for remote_fork_branch in $(git branch -r | grep 'origin/ci-auto-update-'); do
            local_branch=${remote_fork_branch#origin/}
            
            if ! git show-ref --verify --quiet refs/remotes/upstream/$local_branch; then
              echo "Upstream deleted $local_branch. Deleting from fork..."
              git push origin --delete $local_branch || echo "Branch already gone on remote."
            else
              echo "Keep $local_branch (Still active upstream)."
            fi
          done
